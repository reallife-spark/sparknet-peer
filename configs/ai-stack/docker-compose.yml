# The node's own AI stack, as committed config.
#
# Every node runs its own chat surface (Open WebUI) on top of its own model
# server and its own vector store — the Master is a node like the others for its
# own prompts. This file is the declarative slice of adoption item 3 in
# CLUSTER_INFERENCE_DESIGN.md: configured here so it survives a redeploy, and
# deployed by joining the node's own `~/infra` compose stack (Ollama on
# `0.0.0.0:11434`) and the Qdrant store declared in docker-compose.qdrant.yml,
# so this slice never declares a second model server or a second vector store —
# a node answers from its own.
#
# Network (operator decision, 2026-10-11): Open WebUI shares the HOST network
# namespace. The node's dispatch bridge binds loopback only (`127.0.0.1:4096`),
# and a bridge-network container cannot reach a loopback-only host listener
# (`host-gateway` resolves to the docker0 gateway, not `127.0.0.1`). Host
# networking lets the surface reach the bridge, Ollama and Qdrant all on
# `127.0.0.1` without ever widening the bridge's bind — the loopback-only
# property is exactly what keeps the agent surface off the wire.
#
# Reachability (operator decision, 2026-10-10): the chat surface answers on
# `0.0.0.0:8181` (its `PORT`), so it answers on the node's LAN and overlay
# addresses, and a host firewall (`iptables`/`ip6tables`, `SPARKNET-FW`)
# restricts those ports to loopback + LAN + overlay + the Docker bridge subnets.
# Binding a port is no longer sufficient on its own to keep the node private,
# which is why the firewall rule is part of this decision rather than an
# optional extra.
#
# The boundary this file still enforces: the stack holds no key, no signer socket
# and no $SPARKNET_STATE_DIR mount, so `sign` stays structurally unobtainable.
# Cluster fan-out is still absent: accepting a signed subtask belongs to the task
# ingress + cluster client of adoption item 5.
name: sparknet-node-ai-stack

services:
  # The node's own chat surface, on the host network so it reaches the node's
  # loopback-only dispatch bridge. Ollama is the node's infra container and
  # Qdrant is declared beside this file; both are reachable on `127.0.0.1`.
  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_TAG:-v0.13.0}
    container_name: sparknet-webui
    restart: unless-stopped
    # Shares the host netns (LLM: the bridge is loopback-only). It binds host
    # loopback only; the nginx sidecar owns the published 8181 surface.
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "8180"
      # The node's own model server (its infra Ollama). Never a remote node's
      # overlay address: a node that answers with another node's model stopped
      # being a node.
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      WEBUI_AUTH: "true"
      # Signup is enabled but approval-mediated (fabric ADMIN_FEDERATION_DESIGN.md):
      # a new account lands `pending` and reaches nothing until the Master (via
      # this node's admin agent) accepts it. The node's own admin is a MACHINE
      # service account, created headlessly from the WEBUI_ADMIN_* vars below on
      # first startup; its password is generated at deploy under the node state
      # dir at 0600 and read only by the provisioner and the admin agent, so no
      # human logs in as administrator on a peer. Every value here is deploy-time;
      # no password is ever committed.
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: "pending"
      # Auth/API audit trail at metadata level (user, IP, method, URL): the
      # node-local complement to the auth-event webhooks the admin agent ingests.
      AUDIT_LOG_LEVEL: "METADATA"
      # The admin agent registers its auth-event webhook on a LOOPBACK address
      # (http://127.0.0.1:4130/events; it shares this host netns). Open WebUI
      # refuses any non-global webhook URL unless this is set
      # (retrieval/web/utils.py `_assert_addresses_allowed`), crashing the agent
      # with `HTTP 400 The URL you provided is invalid`. Loopback-only is exactly
      # the design here — the agent never listens on the wire — so opt in.
      ENABLE_LOCAL_WEB_FETCH: "true"
      WEBUI_ADMIN_EMAIL: "${SPARKNET_WEBUI_ADMIN_EMAIL:-}"
      WEBUI_ADMIN_PASSWORD: "${SPARKNET_WEBUI_ADMIN_PASSWORD:-}"
      WEBUI_ADMIN_NAME: "${SPARKNET_WEBUI_ADMIN_NAME:-Sparknet Admin}"
      # Preserve the running instance's session-secret across a compose
      # project migration. Empty on a fresh deploy; Open WebUI generates one.
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"
      # The OpenCode engine is the agent execution path. It is an
      # OpenAI-compatible endpoint on loopback 4204; the engine maps the
      # forwarded WebUI user to that user's private vault sandbox. The old
      # dispatch-bridge model surface (fix/plan/build acks) is deliberately
      # removed: the bridge remains the authority/vault tool surface, never a
      # fake assistant.
      OPENAI_API_BASE_URLS: "http://127.0.0.1:4204/v1"
      OPENAI_API_KEYS: "${SPARKNET_OPENCODE_ENGINE_TOKEN:?set at deploy time; do not commit the engine token}"
      MODEL_FILTER_ENABLED: "true"
      MODEL_FILTER_LIST: "sparknet-chat,sparknet-plan,sparknet-build,qwen3.5-9b-q8:latest,qwen3.8-27b-q4:latest,llama3.2:latest,sparknet-masterspike:latest"
      # The default is the vault-aware engine chat. A local Ollama model remains
      # selectable as a fallback if the engine is down.
      DEFAULT_MODELS: "sparknet-chat"
      # The memory filter is a service adapter, not a second memory store. It
      # talks to the loopback Python gateway, which maps the signed-in WebUI
      # user to that user's provisioned vault before the Go store is touched.
      SPARKNET_MEMORY_GATEWAY_URL: "${SPARKNET_MEMORY_GATEWAY_URL:-http://127.0.0.1:4093}"
      SPARKNET_MEMORY_WEBUI_TOKEN: "${SPARKNET_MEMORY_WEBUI_TOKEN:-}"
      SPARKNET_MEMORY_CAPTURE: "${SPARKNET_MEMORY_CAPTURE:-on}"
      # Knowledge comes from the node's own Qdrant server, but only a
      # STRUCTURE-ONLY corpus is ever ingested (schema, taxonomy, charters,
      # contracts) — never the vault's personal pages (00_System/user.md,
      # 02_Daily, 03_Sources, .state). The corpus builder is
      # scripts/sparknet-rag-corpus.py.
      RAG_INGESTION_ENABLED: "true"
      # Keep the CPU MiniLM model the existing KBs were embedded with. The
      # node's Qwen3/Nomic Ollama embeddings were measured at ~20 s per request
      # on agx64 (GPU shared with the text model), which makes a reindex
      # unusable. Upgrade only when a dedicated embed engine is resident.
      RAG_EMBEDDING_ENGINE: ""
      RAG_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_TOP_K: "8"
      RAG_CHUNK_SIZE: "1000"
      RAG_CHUNK_OVERLAP: "150"
      VECTOR_DB: "qdrant"
      # Qdrant is declared in docker-compose.qdrant.yml and bound to loopback.
      # The key is deploy-time; no secret is committed. Open WebUI persists
      # ConfigVar values after first boot, so the migration runbook must clear
      # a stale VECTOR_DB/QDRANT_URI from an existing database before relying
      # on these values.
      QDRANT_URI: "http://127.0.0.1:6333"
      QDRANT_API_KEY: "${SPARKNET_QDRANT_API_KEY:?set at deploy time; do not commit}"
      QDRANT_ON_DISK: "true"
      # One memory plane: the Sparknet memory filter/gateway. Open WebUI's
      # built-in memory store is not a second vault.
      ENABLE_MEMORIES: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      WEBUI_NAME: "Sparknet Node"
      WEBUI_URL: "${SPARKNET_WEBUI_PUBLIC_URL:-http://127.0.0.1:8181}"
    volumes:
      - open-webui-data:/app/backend/data

  # The only published surface. It proxies Open WebUI on host loopback, serves
  # /sparknet-console/ from the read-only console, and injects the launcher into
  # the Open WebUI HTML. The launcher is a same-origin link block, not a second
  # auth system.
  nginx:
    image: nginx:1.27-alpine
    container_name: sparknet-webui-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      SPARKNET_BIND: "8181"
      SPARKNET_CONSOLE_UPSTREAM: "127.0.0.1:8099"
      SPARKNET_WEBUI_PORT: "8180"
    volumes:
      - ../../../webui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../../webui/console/sparknet-menu.js:/etc/nginx/sparknet-menu.js:ro
    depends_on:
      - open-webui
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8181/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # Chat/session state, like the admin surface's open-webui-data. The node-VAULT
  # `.state` bind-mount rule is about key material and authz state, which this
  # stack must never hold.
  open-webui-data:
