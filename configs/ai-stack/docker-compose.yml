# The node's own AI stack, as committed config.
#
# Every node runs its own chat surface (Open WebUI) on top of its own model
# server and its own vector store — the Master is a node like the others for its
# own prompts. This file is the declarative slice of adoption item 3 in
# CLUSTER_INFERENCE_DESIGN.md: configured here so it survives a redeploy, and
# deployed by joining the node's own `~/infra` compose stack (which already runs
# Ollama on `0.0.0.0:11434` and ChromaDB on `0.0.0.0:18000`), so this slice never
# declares a second model server or a second vector store — a node answers from
# its own.
#
# Network (operator decision, 2026-10-11): Open WebUI shares the HOST network
# namespace. The node's dispatch bridge binds loopback only (`127.0.0.1:4096`),
# and a bridge-network container cannot reach a loopback-only host listener
# (`host-gateway` resolves to the docker0 gateway, not `127.0.0.1`). Host
# networking lets the surface reach the bridge, Ollama and ChromaDB all on
# `127.0.0.1` without ever widening the bridge's bind — the loopback-only
# property is exactly what keeps the agent surface off the wire.
#
# Reachability (operator decision, 2026-10-10): the chat surface answers on
# `0.0.0.0:8181` (its `PORT`), so it answers on the node's LAN and overlay
# addresses, and a host firewall (`iptables`/`ip6tables`, `SPARKNET-FW`)
# restricts those ports to loopback + LAN + overlay + the Docker bridge subnets.
# Binding a port is no longer sufficient on its own to keep the node private,
# which is why the firewall rule is part of this decision rather than an
# optional extra.
#
# The boundary this file still enforces: the stack holds no key, no signer socket
# and no $SPARKNET_STATE_DIR mount, so `sign` stays structurally unobtainable.
# Cluster fan-out is still absent: accepting a signed subtask belongs to the task
# ingress + cluster client of adoption item 5.
name: sparknet-node-ai-stack

services:
  # The node's own chat surface, on the host network so it reaches the node's
  # loopback-only dispatch bridge. Ollama and ChromaDB are the node's infra
  # containers, both reachable on `127.0.0.1` through their published ports.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sparknet-webui
    restart: unless-stopped
    # Shares the host netns (LLM: the bridge is loopback-only). LAN + overlay
    # reachability on 8181 is gated by the SPARKNET-FW host firewall.
    network_mode: host
    environment:
      # With host networking the container listens on the host directly; PORT is
      # the only knob that moves the surface off Open WebUI's default 8080.
      PORT: "8181"
      # The node's own model server (its infra Ollama). Never a remote node's
      # overlay address: a node that answers with another node's model stopped
      # being a node.
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      WEBUI_AUTH: "true"
      # ENABLE_SIGNUP stays false; the first admin is created headlessly from the
      # WEBUI_ADMIN_* vars below on first startup when no users exist, so a chat
      # surface is never self-service. Both are deploy-time variables; no
      # password is ever committed.
      ENABLE_SIGNUP: "false"
      WEBUI_ADMIN_EMAIL: "${SPARKNET_WEBUI_ADMIN_EMAIL:-}"
      WEBUI_ADMIN_PASSWORD: "${SPARKNET_WEBUI_ADMIN_PASSWORD:-}"
      WEBUI_ADMIN_NAME: "${SPARKNET_WEBUI_ADMIN_NAME:-Sparknet Admin}"
      # Step 5 surface — the node's agents as OpenAI-compatible models on THIS
      # node's dispatch bridge (loopback 4096; on the host netns the loopback
      # address is the host's own). The roles come from
      # ../manifests/agent-models.json: declared here, not clicked into Open
      # WebUI's database, so a redeploy cannot lose the surface.
      OPENAI_API_BASE_URLS: "http://127.0.0.1:4096/v1"
      # A signed session grant for this stack, mounted at deploy time. Never a
      # committed token — grants expire, and a standing bearer token in the tree
      # would be the quieter way to lose authority. Compose fails loudly while
      # the variable is unset.
      OPENAI_API_KEYS: "${SPARKNET_WEBUI_BRIDGE_GRANT:?set at deploy time; do not commit a grant}"
      MODEL_FILTER_ENABLED: "true"
      MODEL_FILTER_LIST: "plan,build,vault,node-orchestrator,masterspike"
      DEFAULT_MODELS: "plan"
      # Knowledge comes from the node's own ChromaDB, but only a STRUCTURE-ONLY
      # corpus is ever ingested (schema, taxonomy, charters, contracts) — never
      # the vault's personal pages (00_System/user.md, 02_Daily, 03_Sources,
      # .state). The corpus builder is scripts/sparknet-rag-corpus.py.
      RAG_INGESTION_ENABLED: "true"
      VECTOR_DB: "chroma"
      # ChromaDB is the node's infra container, published on 127.0.0.1:18000.
      CHROMA_HTTP_HOST: "127.0.0.1"
      CHROMA_HTTP_PORT: "18000"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  # Chat/session state, like the admin surface's open-webui-data. The node-VAULT
  # `.state` bind-mount rule is about key material and authz state, which this
  # stack must never hold.
  open-webui-data:
